name: Confluence research tools acquisition

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/confluence-research-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download pinned open-source Java analysis tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/confluence-tools"
          cd "$RUNNER_TEMP/confluence-tools"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -o cfr-0.152.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -o spotbugs-4.10.3.tgz \
            https://github.com/spotbugs/spotbugs/releases/download/4.10.3/spotbugs-4.10.3.tgz
          tar -xzf spotbugs-4.10.3.tgz

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            -o findsecbugs-plugin-1.14.0.jar \
            https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/1.14.0/findsecbugs-plugin-1.14.0.jar

          sha256sum cfr-0.152.jar spotbugs-4.10.3.tgz findsecbugs-plugin-1.14.0.jar > SHA256SUMS
          java -jar cfr-0.152.jar --version > cfr-version.txt
          spotbugs-4.10.3/bin/spotbugs -version > spotbugs-version.txt
          ls -lh

      - name: Upload open-source analysis tools
        uses: actions/upload-artifact@v4
        with:
          name: confluence-java-analysis-tools
          path: ${{ runner.temp }}/confluence-tools
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
