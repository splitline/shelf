name: Confluence backend research artifact acquisition

on:
  push:
    branches:
      - research/confluence-10.2.15-acquire
    paths:
      - .github/workflows/confluence-backend-research.yml
      - tools/confluence-research/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/confluence-backend-research.yml
      - tools/confluence-research/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confluence-backend-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CURRENT_VERSION: "10.2.15"
      PREVIOUS_VERSION: "10.2.14"
    steps:
      - name: Check out the temporary research branch
        uses: actions/checkout@v4

      - name: Acquire official distributions, encrypt, and split
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ROOT="$RUNNER_TEMP/confluence-research"
          PLAIN="$ROOT/plain"
          ENCRYPTED="$ROOT/encrypted"
          EXPORT="$GITHUB_WORKSPACE/.confluence-artifacts"
          CHUNKS="$EXPORT/chunks"
          META="$EXPORT/metadata"
          mkdir -p "$PLAIN" "$ENCRYPTED" "$CHUNKS" "$META"

          cert="tools/confluence-research/recipient-cert.pem"
          openssl x509 -in "$cert" -noout -subject -fingerprint -sha256

          acquire_version() {
            local version="$1"
            local work="$ROOT/work-$version"
            local raw="$work/rootfs"
            local archive="$work/atlassian-confluence-$version.tar.gz"
            local source_file="$work/acquisition-source.txt"
            mkdir -p "$raw"

            local acquired=""
            local url=""
            for url in \
              "https://www.atlassian.com/software/confluence/downloads/binary/atlassian-confluence-$version.tar.gz" \
              "https://product-downloads.atlassian.com/software/confluence/downloads/atlassian-confluence-$version.tar.gz" \
              "https://downloads.atlassian.com/software/confluence/downloads/atlassian-confluence-$version.tar.gz"
            do
              rm -f "$archive"
              if curl --fail --silent --show-error --location \
                   --retry 5 --retry-all-errors --connect-timeout 30 \
                   --output "$archive" "$url" \
                 && tar -tzf "$archive" >/dev/null 2>&1; then
                tar -xzf "$archive" -C "$raw"
                printf 'archive\n%s\n' "$url" > "$source_file"
                acquired="archive"
                break
              fi
            done

            if [[ -z "$acquired" ]]; then
              local tag=""
              local image=""
              local cid=""
              for tag in \
                "$version-ubuntu-jdk21" \
                "$version-jdk21" \
                "$version"
              do
                image="atlassian/confluence:$tag"
                if docker pull --quiet "$image" >/dev/null; then
                  cid="$(docker create "$image")"
                  docker export "$cid" | tar -xf - -C "$raw"
                  docker rm "$cid" >/dev/null
                  {
                    printf 'docker\n%s\n' "$image"
                    docker image inspect "$image" --format '{{json .RepoDigests}}'
                    docker image inspect "$image" --format '{{json .Id}}'
                  } > "$source_file"
                  acquired="docker"
                  docker image rm "$image" >/dev/null 2>&1 || true
                  break
                fi
              done
            fi

            if [[ -z "$acquired" ]]; then
              echo "Could not acquire Confluence $version from official archive URLs or official Docker Hub image" >&2
              exit 20
            fi

            local libdir=""
            libdir="$(find "$raw" -type d -path '*/confluence/WEB-INF/lib' -print -quit)"
            if [[ -z "$libdir" ]]; then
              echo "Confluence WEB-INF/lib landmark not found for $version" >&2
              find "$raw" -maxdepth 6 -type d -print | head -200 >&2
              exit 21
            fi

            local appdir=""
            local install=""
            appdir="$(dirname "$(dirname "$libdir")")"
            install="$(dirname "$appdir")"

            if [[ ! -f "$appdir/WEB-INF/web.xml" ]]; then
              echo "web.xml landmark not found for $version" >&2
              exit 23
            fi
            if ! find "$libdir" -maxdepth 1 -type f -name '*.jar' -print -quit | grep -q .; then
              echo "No Java archives found in WEB-INF/lib for $version" >&2
              exit 24
            fi

            local meta="$work/metadata"
            mkdir -p "$meta"
            cp "$source_file" "$meta/acquisition-source.txt"
            printf '%s\n' "$version" > "$meta/requested-version.txt"
            printf '%s\n' "$install" > "$meta/install-path.txt"
            printf '%s\n' "$appdir" > "$meta/application-path.txt"
            if [[ -s "$archive" ]]; then
              sha256sum "$archive" > "$meta/source-archive.sha256"
              stat --printf='%s\n' "$archive" > "$meta/source-archive.size"
            fi

            find "$libdir" -maxdepth 1 -type f -name '*.jar' -printf '%f\n' \
              | LC_ALL=C sort > "$meta/web-inf-lib-jars.txt"
            find "$install" -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$meta/install-files.sha256"
            find "$install" -type f -printf '%s\t%p\n' \
              | LC_ALL=C sort -n > "$meta/install-files.tsv"
            find "$install" -type f \( -name '*.jar' -o -name '*.war' -o -name '*.ear' \) \
              -printf '%s\t%p\n' | LC_ALL=C sort > "$meta/java-archives.tsv"

            local package="$PLAIN/confluence-$version-install-and-metadata.tar.gz"
            tar -C "$(dirname "$install")" -czf "$package" \
              "$(basename "$install")" \
              -C "$work" metadata

            local encrypted="$ENCRYPTED/$(basename "$package").cms"
            openssl cms -encrypt -binary -aes256 \
              -in "$package" -out "$encrypted" -outform DER "$cert"

            sha256sum "$package" > "$PLAIN/$(basename "$package").sha256"
            openssl cms -encrypt -binary -aes256 \
              -in "$PLAIN/$(basename "$package").sha256" \
              -out "$META/$(basename "$package").sha256.cms" \
              -outform DER "$cert"

            split -b 300000000 -d -a 2 \
              "$encrypted" "$CHUNKS/$(basename "$encrypted").part-"

            rm -rf "$work" "$package" "$PLAIN/$(basename "$package").sha256" "$encrypted"
          }

          acquire_version "$CURRENT_VERSION"
          acquire_version "$PREVIOUS_VERSION"

          sha256sum "$CHUNKS"/* > "$META/chunk-SHA256SUMS"
          find "$CHUNKS" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | LC_ALL=C sort > "$META/chunk-sizes.tsv"
          cat > "$META/reconstruct.txt" <<'EOF'
          Verify chunk-SHA256SUMS, concatenate parts in lexical order for each version,
          then decrypt with: openssl cms -decrypt -binary -inform DER -in FILE.cms \
          -recip cert.pem -inkey private.pem -out FILE.tar.gz
          EOF
          ls -lh "$CHUNKS" "$META"

      - name: Upload encrypted metadata
        uses: actions/upload-artifact@v4
        with:
          name: confluence-encrypted-metadata
          path: .confluence-artifacts/metadata/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload current part 00
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.15-part-00
          path: .confluence-artifacts/chunks/confluence-10.2.15-install-and-metadata.tar.gz.cms.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload current part 01
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.15-part-01
          path: .confluence-artifacts/chunks/confluence-10.2.15-install-and-metadata.tar.gz.cms.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload current part 02
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.15-part-02
          path: .confluence-artifacts/chunks/confluence-10.2.15-install-and-metadata.tar.gz.cms.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload current part 03
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.15-part-03
          path: .confluence-artifacts/chunks/confluence-10.2.15-install-and-metadata.tar.gz.cms.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload current part 04
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.15-part-04
          path: .confluence-artifacts/chunks/confluence-10.2.15-install-and-metadata.tar.gz.cms.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload previous part 00
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.14-part-00
          path: .confluence-artifacts/chunks/confluence-10.2.14-install-and-metadata.tar.gz.cms.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload previous part 01
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.14-part-01
          path: .confluence-artifacts/chunks/confluence-10.2.14-install-and-metadata.tar.gz.cms.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload previous part 02
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.14-part-02
          path: .confluence-artifacts/chunks/confluence-10.2.14-install-and-metadata.tar.gz.cms.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload previous part 03
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.14-part-03
          path: .confluence-artifacts/chunks/confluence-10.2.14-install-and-metadata.tar.gz.cms.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload previous part 04
        uses: actions/upload-artifact@v4
        with:
          name: confluence-10.2.14-part-04
          path: .confluence-artifacts/chunks/confluence-10.2.14-install-and-metadata.tar.gz.cms.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
